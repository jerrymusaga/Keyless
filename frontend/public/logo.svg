<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 56" width="176" height="56" role="img" aria-label="Keyless">
  <!-- Ink tile so the near-white wordmark reads on any background (light or dark) -->
  <rect width="176" height="56" rx="12" fill="#0b0d12"/>
  <rect x="0.75" y="0.75" width="174.5" height="54.5" rx="11.25" fill="none" stroke="#1d2230" stroke-width="1.5"/>

  <!-- KeyholeMark — exact site geometry, scaled and vertically centered -->
  <g transform="translate(16 11.6) scale(1.4)" fill="none" stroke-width="1.6" stroke-linecap="round">
    <path d="M8 10V7a4 4 0 0 1 7.5-1.9" stroke="#2ed3bd"/>
    <rect x="4" y="10" width="16" height="11" rx="2.5" stroke="#e6e9f2"/>
    <circle cx="12" cy="15" r="1.6" fill="#2ed3bd" stroke="none"/>
    <path d="M12 16.6V18.2" stroke="#2ed3bd"/>
  </g>

  <!-- Wordmark: site header mono, 0.2em tracking, mist-100 -->
  <text x="62" y="28" dominant-baseline="central"
        font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace"
        font-size="17" font-weight="500" letter-spacing="3.4" fill="#e6e9f2">KEYLESS</text>
</svg>
