[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.23"
optimizer = true
optimizer_runs = 200
evm_version = "paris"

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
coston2 = "${COSTON2_RPC}"
coston = "${COSTON_RPC}"

[etherscan]
coston2 = { key = "${FLARE_EXPLORER_KEY}", url = "https://coston2-explorer.flare.network/api" }
